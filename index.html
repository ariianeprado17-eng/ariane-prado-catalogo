<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ariane Prado | Beauty & Presentes</title>

  <meta name="description" content="Catálogo online Ariane Prado | Beauty & Presentes">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #faf8f6;
      color: #3d3835;
    }

    header {
      background: #eee6df;
      padding: 25px 18px 20px;
      text-align: center;
      border-bottom: 1px solid #e2d8d0;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 27px;
      letter-spacing: 1px;
      color: #403934;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #746963;
    }

    .tagline {
      margin-top: 12px;
      font-size: 13px;
      color: #81756e;
    }

    .top-bar {
      max-width: 1100px;
      margin: 18px auto 0;
      padding: 0 15px;
    }

    .search {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #ddd3cc;
      border-radius: 30px;
      background: white;
      font-size: 15px;
      outline: none;
    }

    .search:focus {
      border-color: #b99e8d;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 15px 0 5px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      white-space: nowrap;
      border: 1px solid #d8ccc3;
      background: white;
      color: #5d534d;
      padding: 9px 16px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 13px;
    }

    .category-btn.active {
      background: #4f4742;
      color: white;
      border-color: #4f4742;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 15px;
    }

    .section-title {
      font-family: Georgia, serif;
      font-size: 22px;
      margin: 12px 0 18px;
      color: #403934;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product {
      background: white;
      border: 1px solid #eee6e0;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(60, 50, 45, 0.04);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: white;
      padding: 10px;
    }

    .product-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .brand {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9a887c;
      margin-bottom: 5px;
    }

    .product-name {
      font-family: Georgia, serif;
      font-size: 15px;
      line-height: 1.35;
      min-height: 42px;
      color: #403934;
    }

    .prices {
      margin-top: 10px;
      min-height: 48px;
    }

    .old-price {
      display: block;
      color: #999;
      text-decoration: line-through;
      font-size: 12px;
      margin-bottom: 3px;
    }

    .price {
      font-size: 19px;
      font-weight: bold;
      color: #403934;
    }

    .add-button {
      margin-top: 10px;
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 7px;
      background: #4f4742;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }

    .add-button:active {
      transform: scale(0.98);
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #81756e;
    }

    /* CARRINHO */

    .cart-button {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 1000;
      border: none;
      background: #403934;
      color: white;
      padding: 14px 19px;
      border-radius: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,.18);
      cursor: pointer;
      font-size: 14px;
    }

    .cart-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #c5a895;
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      margin-left: 7px;
      font-size: 12px;
      font-weight: bold;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 1999;
    }

    .overlay.active {
      display: block;
    }

    .cart {
      position: fixed;
      right: 0;
      top: 0;
      height: 100%;
      width: min(420px, 92%);
      background: #fff;
      z-index: 2000;
      transform: translateX(100%);
      transition: transform .3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: -5px 0 25px rgba(0,0,0,.15);
    }

    .cart.open {
      transform: translateX(0);
    }

    .cart-header {
      padding: 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-header h2 {
      font-family: Georgia, serif;
      font-size: 22px;
    }

    .close-cart {
      border: none;
      background: transparent;
      font-size: 27px;
      cursor: pointer;
      color: #665c56;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 65px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item img {
      width: 65px;
      height: 65px;
      object-fit: contain;
      background: white;
      border: 1px solid #eee;
      border-radius: 8px;
    }

    .cart-item-name {
      font-size: 13px;
      line-height: 1.3;
    }

    .cart-item-price {
      font-size: 13px;
      font-weight: bold;
      margin-top: 5px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 7px;
    }

    .quantity button {
      width: 25px;
      height: 25px;
      border: 1px solid #d8ccc3;
      background: white;
      border-radius: 50%;
      cursor: pointer;
    }

    .remove {
      border: none;
      background: transparent;
      color: #a78e7e;
      font-size: 11px;
      cursor: pointer;
      margin-top: 5px;
    }

    .cart-footer {
      padding: 18px;
      border-top: 1px solid #eee;
      background: #faf8f6;
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .whatsapp {
      width: 100%;
      border: none;
      background: #25D366;
      color: white;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .continue {
      width: 100%;
      margin-top: 8px;
      border: 1px solid #d8ccc3;
      background: white;
      color: #554c47;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .empty-cart {
      text-align: center;
      padding: 50px 20px;
      color: #81756e;
    }

    footer {
      text-align: center;
      padding: 45px 20px 100px;
      color: #81756e;
      font-size: 12px;
    }

    @media (min-width: 700px) {
      .products {
        grid-template-columns: repeat(4, 1fr);
      }

      .product-name {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Ariane Prado</div>
  <div class="subtitle">BEAUTY & PRESENTES</div>
  <div class="tagline">Do autocuidado ao presente ideal</div>
</header>

<div class="top-bar">
  <input
    id="search"
    class="search"
    type="search"
    placeholder="O que você procura hoje?"
  >

  <div class="categories">
    <button class="category-btn active" data-category="Todos">
      Todos
    </button>

    <button class="category-btn" data-category="Perfumes">
      Perfumes
    </button>

    <button class="category-btn" data-category="Cuidados Corporais">
      Cuidados corporais
    </button>

    <button class="category-btn" data-category="Infantis">
      Infantis
    </button>
  </div>
</div>

<main class="container">

  <h1 class="section-title">
    Pronta entrega
  </h1>

  <div id="products" class="products"></div>

  <div id="empty" class="empty" style="display:none;">
    Nenhum produto encontrado.
  </div>

</main>

<footer>
  Ariane Prado | Beauty & Presentes<br>
  Do autocuidado ao presente ideal
</footer>

<button class="cart-button" onclick="openCart()">
  🛒 Carrinho
  <span id="cartCount" class="cart-count">0</span>
</button>

<div id="overlay" class="overlay" onclick="closeCart()"></div>

<aside id="cart" class="cart">

  <div class="cart-header">
    <h2>Meu pedido</h2>
    <button class="close-cart" onclick="closeCart()">×</button>
  </div>

  <div id="cartItems" class="cart-items"></div>

  <div class="cart-footer">

    <div class="total">
      <span>Total</span>
      <span id="cartTotal">R$ 0,00</span>
    </div>

    <button class="whatsapp" onclick="sendWhatsApp()">
      📲 Enviar pedido pelo WhatsApp
    </button>

    <button class="continue" onclick="closeCart()">
      Continuar comprando
    </button>

  </div>

</aside>

<script>

  const WHATSAPP = "5512981421547";

  let products = [];
  let cart = [];

  const productsContainer = document.getElementById("products");
  const empty = document.getElementById("empty");
  const search = document.getElementById("search");

  async function loadProducts() {

    try {

      const response = await fetch("produtos.json");

      if (!response.ok) {
        throw new Error("Não foi possível carregar os produtos.");
      }

      products = await response.json();

      products = products.filter(product => product.disponivel !== false);

      renderProducts();

    } catch (error) {

      productsContainer.innerHTML = `
        <div class="empty">
          Não foi possível carregar o catálogo.
          <br><br>
          Atualize a página e tente novamente.
        </div>
      `;

      console.error(error);
    }
  }

  function formatPrice(value) {

    return Number(value).toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL"
    });

  }

  function renderProducts(category = "Todos") {

    const term = search.value.toLowerCase().trim();

    const filtered = products.filter(product => {

      const matchesCategory =
        category === "Todos" ||
        product.categoria === category;

      const matchesSearch =
        !term ||
        product.nome.toLowerCase().includes(term) ||
        product.marca.toLowerCase().includes(term);

      return matchesCategory && matchesSearch;

    });

    productsContainer.innerHTML = "";

    empty.style.display =
      filtered.length === 0 ? "block" : "none";

    filtered.forEach(product => {

      const hasPromotion =
        product.precoPromocional &&
        product.precoPromocional < product.precoCheio;

      const price = hasPromotion
        ? product.precoPromocional
        : product.precoCheio;

      const card = document.createElement("article");

      card.className = "product";

      card.innerHTML = `

        <img
          class="product-image"
          src="${product.imagem}"
          alt="${product.nome}"
          loading="lazy"
        >

        <div class="product-info">

          <div class="brand">
            ${product.marca}
          </div>

          <div class="product-name">
            ${product.nome}
          </div>

          <div class="prices">

            ${
              hasPromotion
              ? `<span class="old-price">${formatPrice(product.precoCheio)}</span>`
              : ""
            }

            <span class="price">
              ${formatPrice(price)}
            </span>

          </div>

          <button
            class="add-button"
            onclick="addToCart('${product.id}')"
          >
            + Adicionar ao carrinho
          </button>

        </div>
      `;

      productsContainer.appendChild(card);

    });

  }

  function addToCart(id) {
    const product = products.find(p => p.id === id);

    if (!product) return;

    const estoque = Number(product.estoque);

    if (estoque <= 0) {
        alert("Produto esgotado. ❤️");
        return;
    }

    const existing = cart.find(item => item.id === id);

    if (existing) {
        if (existing.quantity >= estoque) {
            alert(`Você só pode adicionar ${estoque} unidade(s) deste produto. ❤️`);
            return;
        }

        existing.quantity++;
    } else {
        cart.push({
            ...product,
            quantity: 1
        });
    }

    updateCart();
    openCart();
}

  function changeQuantity(id, amount) {
    const item = cart.find(product => product.id === id);

    if (!item) return;

    const estoque = Number(item.estoque);

    if (amount > 0 && item.quantity >= estoque) {
        alert(`Você só pode adicionar ${estoque} unidade(s) deste produto. ❤️`);
        return;
    }

    item.quantity += amount;

    if (item.quantity <= 0) {
        cart = cart.filter(product => product.id !== id);
    }

    updateCart();
  }

  function removeFromCart(id) {

    cart = cart.filter(product => product.id !== id);

    updateCart();

  }

  function updateCart() {

    const cartItems = document.getElementById("cartItems");

    const count = cart.reduce(
      (total, item) => total + item.quantity,
      0
    );

    document.getElementById("cartCount").textContent = count;

    if (cart.length === 0) {

      cartItems.innerHTML = `
        <div class="empty-cart">
          Seu carrinho está vazio. ❤️
          <br><br>
          Escolha seus produtos e adicione ao pedido.
        </div>
      `;

      document.getElementById("cartTotal").textContent =
        formatPrice(0);

      return;

    }

    cartItems.innerHTML = "";

    let total = 0;

    cart.forEach(item => {

      const price =
        item.precoPromocional &&
        item.precoPromocional < item.precoCheio
          ? item.precoPromocional
          : item.precoCheio;

      const subtotal = price * item.quantity;

      total += subtotal;

      const div = document.createElement("div");

      div.className = "cart-item";

      div.innerHTML = `

        <img
          src="${item.imagem}"
          alt="${item.nome}"
        >

        <div>

          <div class="cart-item-name">
            ${item.nome}
          </div>

          <div class="cart-item-price">
            ${formatPrice(price)}
          </div>

          <div class="quantity">

            <button
              onclick="changeQuantity('${item.id}', -1)"
            >
              −
            </button>

            <strong>
              ${item.quantity}
            </strong>

            <button
              onclick="changeQuantity('${item.id}', 1)"
            >
              +
            </button>

          </div>

          <button
            class="remove"
            onclick="removeFromCart('${item.id}')"
          >
            Remover
          </button>

        </div>

        <strong>
          ${formatPrice(subtotal)}
        </strong>

      `;

      cartItems.appendChild(div);

    });

    document.getElementById("cartTotal").textContent =
      formatPrice(total);

  }

  function openCart() {

    document.getElementById("cart").classList.add("open");

    document.getElementById("overlay").classList.add("active");

    updateCart();

  }

  function closeCart() {

    document.getElementById("cart").classList.remove("open");

    document.getElementById("overlay").classList.remove("active");

  }

  function sendWhatsApp() {

    if (cart.length === 0) {

      alert("Adicione pelo menos um produto ao carrinho.");

      return;

    }

    let message =
      "🛍️ *Olá, Ariane! Gostaria de fazer este pedido:*\n\n";

    let total = 0;

    cart.forEach(item => {

      const price =
  
        item.precoPromocional &&
        item.precoPromocional < item.precoCheio
         ? item.precoPromocional
         : item.precoCheio;

      const subtotal = price * item.quantity;

      total += subtotal;

      message +=
        `• ${item.quantity}x ${item.nome} — $
          {formatPrice(subtotal)}\n`;
    });

    message +=
      `\n💰 *Total do pedido: ${formatPrice(total)}*\n\n`;

    message +=
      "🤎 Aguardo a confirmação do pedido. Obrigada!";

    const url =
      `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}`;

    window.open(url, "_blank");

    document.querySelectorAll(".category-btn").forEach(button => {

    button.addEventListener("click", () => {

      document
        .querySelectorAll(".category-btn")
        .forEach(btn => btn.classList.remove("active"));

      button.classList.add("active");

      renderProducts(button.dataset.category);

    });

  });

  search.addEventListener("input", () => {

    const active =
      document.querySelector(".category-btn.active");

    renderProducts(active.dataset.category);

  });

  loadProducts();

</script>

</body>
</html>
